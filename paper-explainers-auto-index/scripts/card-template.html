<!-- Copy this file into your explainer's folder as card.html and fill it in.
     data-date (YYYY-MM) sets the order on the home page, newest first.
     Links are relative to the explainer's folder, so "index.html" means
     the explainer itself. Any <style> block here is moved into the home
     page's stylesheet, for thumbnail animations. -->
<li class="paper" data-date="YYYY-MM">
  <div class="thumb" aria-hidden="true">
    <svg viewBox="0 0 420 220"><!-- a simple illustration, or replace with an <img src="thumb.png" alt=""> --></svg>
  </div>
  <div class="body">
    <p class="meta"><b>Journal name</b> · Year</p>
    <h3>Paper title</h3>
    <p class="summary">Two sentences in plain language: what was done and what was found.</p>
    <ul class="tags"><li>Topic</li><li>Topic</li><li>N interactive figures</li></ul>
    <div class="actions">
      <a class="btn primary" href="index.html">Explore the explainer</a>
      <a class="btn" href="https://doi.org/...">Read the paper</a>
    </div>
  </div>
</li>
